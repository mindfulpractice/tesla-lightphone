<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla for Light Phone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
        p { color: #666; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
        a.btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #1a1a1a;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        a.btn:hover { background: #333; }
        .screenshots { margin: 1.5rem 0; }
        .screenshots img { width: 100%; max-width: 900px; border-radius: 8px; }
        .credits { margin-top: 2rem; font-size: 0.8rem; color: #999; }
        .credits a { color: #999; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tesla for Light Phone</h1>
        <p>Control your Tesla from your Light Phone 3. Lock, unlock, climate, and more.</p>
        <div class="screenshots"><img src="/screenshots/combined.png" alt="App screenshots"></div>
        <a class="btn" href="/setup">Credential Setup</a>
        <a class="btn" href="/faq" style="background: #fff; color: #1a1a1a; border: 1px solid #ddd; margin-left: 0.5rem;">FAQ</a>
        <p class="credits">Built with the help of <a href="https://claude.ai">Claude</a></p>
    </div>
</body>
</html>
